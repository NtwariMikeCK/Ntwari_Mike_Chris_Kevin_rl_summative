[project]
name = "student-name-rl-summative"
version = "0.1.0"
description = "Autonomous Medical Drone Delivery — RL summative (DQN, REINFORCE, PPO, A2C)"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "pygame>=2.5",
    "numpy>=1.26",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["environment", "training"]
